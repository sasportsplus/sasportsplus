<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cricket Tournament Admin Desk</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111f;
        --panel: #101c30;
        --panel-2: #16253f;
        --text: #e9f1ff;
        --muted: #9eb2cf;
        --accent: #33d1c9;
        --accent-2: #ffb84d;
        --danger: #ff5f7e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg), #13233a);
        color: var(--text);
        min-height: 100vh;
      }
      .app-shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }
      .hero h1 { margin: 0; font-size: 2rem; }
      .hero p { margin: 6px 0 0; color: var(--muted); }
      .hero-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .view-toggle { display: flex; gap: 8px; flex-wrap: wrap; }
      .btn {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn-primary { background: var(--accent); color: #04211f; }
      .grid { display: grid; gap: 16px; grid-template-columns: 1.5fr 1fr; }
      .panel {
        background: rgba(16, 28, 48, 0.95);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        padding: 18px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.25);
      }
      .stats { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0,1fr)); margin-bottom: 16px; }
      .stat-card { background: var(--panel-2); border-radius: 14px; padding: 14px; }
      .stat-card strong { display: block; font-size: 1.2rem; margin-top: 6px; }
      .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
      .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
      .calendar-head { text-align: center; color: var(--muted); font-size: 0.85rem; padding-bottom: 4px; }
      .day-cell {
        min-height: 82px;
        background: var(--panel-2);
        border-radius: 12px;
        padding: 8px;
        border: 1px solid transparent;
      }
      .day-cell.muted { opacity: 0.45; }
      .day-cell.today { border-color: var(--accent); }
      .day-cell.conflict { border-color: var(--danger); box-shadow: inset 0 0 0 1px rgba(255,95,126,0.35); }
      .day-cell.saturday { background: rgba(255, 184, 77, 0.16); border-color: rgba(255, 184, 77, 0.35); }
      .day-cell.sunday { background: rgba(51, 209, 201, 0.14); border-color: rgba(51, 209, 201, 0.3); }
      .day-label { font-weight: 700; margin-bottom: 6px; }
      .chip {
        display: inline-block;
        font-size: 0.72rem;
        padding: 3px 6px;
        border-radius: 999px;
        margin: 2px 0;
        background: rgba(51, 209, 201, 0.18);
        color: var(--accent);
      }
      .chip.warning { background: rgba(255,95,126,0.18); color: var(--danger); }
      .list { display: flex; flex-direction: column; gap: 10px; }
      .section-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
      .reminder-list { max-height: 70vh; overflow-y: auto; padding-right: 6px; }
      .reminder-card { background: var(--panel-2); padding: 12px; border-radius: 14px; border-left: 4px solid var(--accent); }
      .reminder-card.fee { border-left-color: var(--accent-2); }
      .muted { color: var(--muted); }
      .modal-overlay {
        position: fixed; inset: 0; background: rgba(2,7,16,0.78); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
      }
      .modal-card { width: min(620px, 100%); background: var(--panel); border-radius: 18px; padding: 20px; }
      .field-group { display: grid; gap: 6px; margin-bottom: 12px; }
      .field-group input, .field-group select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: var(--panel-2); color: var(--text); }
      .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .warning { color: var(--danger); margin-top: 10px; background: rgba(255,95,126,0.12); padding: 10px 12px; border-radius: 10px; }
      .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
      @media (max-width: 960px) {
        .grid { grid-template-columns: 1fr; }
        .stats { grid-template-columns: 1fr; }
        .field-row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="./scheduleLogic.js"></script>
    <script type="text/babel" src="./index.jsx"></script>
  </body>
</html>
